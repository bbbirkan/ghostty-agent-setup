# tmux config for a server that keeps your agents alive.
# Prefix is Ctrl-a (not the default Ctrl-b). Reload inside tmux: Ctrl-a r

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g base-index 1            # windows start at 1
set -g pane-base-index 1
set -g renumber-windows on     # no gaps after closing a window
set -sg escape-time 0          # no ESC delay (vim/neovim)
set -g mouse on                # click panes, scroll with the wheel

# Splits that remember the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Move between panes with Ctrl-h/j/k/l (no prefix needed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Shift + arrows switch windows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

bind r source-file ~/.tmux.conf \; display "~/.tmux.conf reloaded"
bind s choose-tree -Zs         # session list

# Vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
